
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: procureguard
      POSTGRES_USER: procureguard
      POSTGRES_PASSWORD: procureguard_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureguard -d procureguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://procureguard:procureguard_dev_only@db:5432/procureguard
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 15
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
